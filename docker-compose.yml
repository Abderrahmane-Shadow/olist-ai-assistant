version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service with Olist dataset schema
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: olist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-olist_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Text-to-SQL + Review Intelligence Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: olist_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-olist_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_READONLY_USER: ${DB_READONLY_USER:-olist_readonly}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-olist_readonly_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # Next.js Frontend Service (Dashboard + Chat Interface)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: olist_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
