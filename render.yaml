services:
  - type: web
    name: olist-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_RO_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite,gemini-3.8-flash
      - key: CORS_ORIGINS
        value: https://olist-ai-assistant.vercel.app,http://localhost:3000
      - key: REQUIRE_AUTH
        value: "true"
      - key: MAX_DAILY_QUESTIONS_PER_USER
        value: "15"
      - key: MAX_CONCURRENT_PER_USER
        value: "2"
